<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/Logo-min.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="description" content="Aplikasi manajemen laundry modern - Homie Laundry" />
  <meta name="application-name" content="Homie Laundry" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Homie Laundry" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS Icons (Menggunakan Logo-min.png yang ada di public/) -->
  <link rel="apple-touch-icon" href="/Logo-min.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/Logo-min.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/Logo-min.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/Logo-min.png" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Tailwind CSS v4.1 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
            },
            success: '#10b981',
            warning: '#f59e0b',
            danger: '#ef4444',
          },
          animation: {
            'pulse': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'spin': 'spin 1s linear infinite',
            'bounce': 'bounce 1s infinite',
          },
        }
      }
    }
  </script>

  <title>Homie Laundry</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- PWA Register Script -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => { });
      });
    }
  </script>
</body>

</html>
